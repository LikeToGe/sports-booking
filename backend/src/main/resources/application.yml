server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

spring:
  application:
    name: sports-booking-admin
  datasource:
    url: ${APP_DB_URL:jdbc:mysql://127.0.0.1:3306/sports_booking?characterEncoding=utf8&serverTimezone=UTC}
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: ${APP_REDIS_CONNECT_TIMEOUT:1s}
      timeout: ${APP_REDIS_TIMEOUT:1s}
  jackson:
    time-zone: UTC

app:
  auth:
    platform-mfa-code: ${APP_PLATFORM_MFA_CODE:246810}
  session:
    ttl-hours: ${APP_SESSION_TTL_HOURS:8}
    secure-cookie: ${APP_SESSION_SECURE_COOKIE:true}
