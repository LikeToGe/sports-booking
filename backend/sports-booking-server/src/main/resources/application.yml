server:
  port: 8089
  servlet:
    context-path: /api

spring:
  application:
    name: yuechang
  datasource:
    url: ${APP_DB_URL:jdbc:mysql://127.0.0.1:3306/sports_booking?characterEncoding=utf8&serverTimezone=UTC}
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: ${APP_REDIS_CONNECT_TIMEOUT:1s}
      timeout: ${APP_REDIS_TIMEOUT:1s}
  jackson:
    time-zone: UTC

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    arg-name-based-constructor-auto-mapping: true
  global-config:
    banner: false

app:
  session:
    ttl-hours: ${APP_SESSION_TTL_HOURS:8}
  booking:
    payment-timeout-minutes: 10
    pending-limit: 2
    create-limit-per-ten-minutes: 5
  credential:
    secret: ${APP_CREDENTIAL_SECRET:local-development-secret-change-me}
  upload:
    directory: ${APP_UPLOAD_DIRECTORY:../data/uploads}
  bootstrap:
    username: ${APP_BOOTSTRAP_ADMIN_USERNAME:admin}
    password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:admin123}
  demo:
    seed-enabled: ${APP_DEMO_SEED_ENABLED:true}
