components:
  securitySchemes:
    adminSession:
      type: apiKey
      in: cookie
      name: ADMIN_SESSION
    miniBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque
    staffBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        maxLength: 128
      description: 同一认证账号、方法和路径内唯一；重复提交返回首次处理结果。
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
      description: 与当前 Cookie 会话绑定的 CSRF 令牌。
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    StoreId:
      name: storeId
      in: path
      required: true
      schema:
        type: string
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema:
        type: string
    BlockerId:
      name: blockerId
      in: path
      required: true
      schema:
        type: string
