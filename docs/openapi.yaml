openapi: 3.1.0
info:
  title: 约场 API
  version: 0.1.0
  description: 本地 Mock MVP；具体时间使用 UTC ISO 8601，页面按 Asia/Shanghai 展示。
servers:
  - url: http://127.0.0.1:8089/api
tags:
  - name: Auth
  - name: Platform
  - name: VenueAdmin
  - name: Mini
  - name: Staff
paths:
  /auth/admin/login:
    post:
      tags: [Auth]
      summary: 后台登录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /auth/admin/logout:
    post:
      tags: [Auth]
      security: [{ AdminToken: [] }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /auth/mini/mock-login:
    post:
      tags: [Auth]
      summary: 小程序模拟登录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /auth/mini/logout:
    post:
      tags: [Auth]
      security: [{ MiniToken: [] }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /auth/mini/profile/detail:
    get:
      tags: [Auth]
      security: [{ MiniToken: [] }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /auth/mini/profile/update:
    put:
      tags: [Auth]
      security: [{ MiniToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contactName, phone]
              properties:
                contactName: { type: string }
                phone: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /platform/venues/list:
    get:
      tags: [Platform]
      security: [{ AdminToken: [] }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /platform/venues/create:
    post:
      tags: [Platform]
      security: [{ AdminToken: [] }]
      summary: 创建场馆及首个管理员
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [venue, adminUsername, adminPassword]
              properties:
                venue: { $ref: '#/components/schemas/VenueWrite' }
                adminUsername: { type: string }
                adminPassword: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /platform/venues/{venueId}/status:
    patch:
      tags: [Platform]
      security: [{ AdminToken: [] }]
      parameters: [{ $ref: '#/components/parameters/VenueId' }]
      requestBody: { $ref: '#/components/requestBodies/Status' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /platform/venues/{venueId}/service-fee-rate:
    patch:
      tags: [Platform]
      security: [{ AdminToken: [] }]
      summary: 更新场馆平台服务费率
      parameters: [{ $ref: '#/components/parameters/VenueId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [serviceFeeRatePercent]
              properties:
                serviceFeeRatePercent:
                  type: number
                  minimum: 0
                  maximum: 30
                  multipleOf: 0.01
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /platform/sports/list:
    get:
      tags: [Platform]
      security: [{ AdminToken: [] }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /platform/sports/create:
    post:
      tags: [Platform]
      security: [{ AdminToken: [] }]
      requestBody: { $ref: '#/components/requestBodies/Name' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /platform/sports/{sportTypeId}/status:
    patch:
      tags: [Platform]
      security: [{ AdminToken: [] }]
      parameters:
        - name: sportTypeId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody: { $ref: '#/components/requestBodies/Status' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /platform/reports/operations:
    get:
      tags: [Platform]
      security: [{ AdminToken: [] }]
      summary: 查询平台经营总报表，可筛选单个场馆
      parameters:
        - { name: venueId, in: query, schema: { type: integer, format: int64 } }
        - { $ref: '#/components/parameters/StartDate' }
        - { $ref: '#/components/parameters/EndDate' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /platform/reports/service-fees:
    get:
      tags: [Platform]
      security: [{ AdminToken: [] }]
      summary: 查询平台月度服务费，可筛选单个场馆
      parameters:
        - { name: venueId, in: query, schema: { type: integer, format: int64 } }
        - { $ref: '#/components/parameters/BillingMonth' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /venue-admin/profile/detail:
    get:
      tags: [VenueAdmin]
      security: [{ AdminToken: [] }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /venue-admin/profile/update:
    put:
      tags: [VenueAdmin]
      security: [{ AdminToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VenueWrite' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /venue-admin/profile/cover:
    post:
      tags: [VenueAdmin]
      security: [{ AdminToken: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /venue-admin/sports/list:
    get:
      tags: [VenueAdmin]
      security: [{ AdminToken: [] }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /venue-admin/sports/create:
    post:
      tags: [VenueAdmin]
      security: [{ AdminToken: [] }]
      requestBody: { $ref: '#/components/requestBodies/Name' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /venue-admin/courts/list:
    get:
      tags: [VenueAdmin]
      security: [{ AdminToken: [] }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /venue-admin/courts/create:
    post:
      tags: [VenueAdmin]
      security: [{ AdminToken: [] }]
      requestBody: { $ref: '#/components/requestBodies/Court' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /venue-admin/courts/{courtId}:
    put:
      tags: [VenueAdmin]
      security: [{ AdminToken: [] }]
      parameters:
        - name: courtId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody: { $ref: '#/components/requestBodies/Court' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /venue-admin/courts/{courtId}/image:
    post:
      tags: [VenueAdmin]
      security: [{ AdminToken: [] }]
      parameters:
        - name: courtId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /venue-admin/weekly-slots/list:
    get:
      tags: [VenueAdmin]
      security: [{ AdminToken: [] }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /venue-admin/weekly-slots/create:
    post:
      tags: [VenueAdmin]
      security: [{ AdminToken: [] }]
      requestBody: { $ref: '#/components/requestBodies/WeeklySlot' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /venue-admin/weekly-slots/{weeklySlotId}/update:
    put:
      tags: [VenueAdmin]
      security: [{ AdminToken: [] }]
      parameters: [{ $ref: '#/components/parameters/WeeklySlotId' }]
      requestBody: { $ref: '#/components/requestBodies/WeeklySlot' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /venue-admin/weekly-slots/{weeklySlotId}/disable:
    delete:
      tags: [VenueAdmin]
      security: [{ AdminToken: [] }]
      parameters: [{ $ref: '#/components/parameters/WeeklySlotId' }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /venue-admin/weekly-slots/copy-day:
    post:
      tags: [VenueAdmin]
      security: [{ AdminToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sourceDay, targetDays]
              properties:
                sourceDay: { type: integer, minimum: 1, maximum: 7 }
                targetDays: { type: array, items: { type: integer, minimum: 1, maximum: 7 } }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /venue-admin/sessions/list:
    get:
      tags: [VenueAdmin]
      security: [{ AdminToken: [] }]
      parameters: [{ $ref: '#/components/parameters/Date' }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /venue-admin/sessions/create:
    post:
      tags: [VenueAdmin]
      security: [{ AdminToken: [] }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /venue-admin/sessions/{sessionSlotId}/open:
    post:
      tags: [VenueAdmin]
      security: [{ AdminToken: [] }]
      summary: 重新开启未来且未冲突的已关闭场次
      parameters: [{ $ref: '#/components/parameters/SessionSlotId' }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /venue-admin/sessions/{sessionSlotId}/close:
    post:
      tags: [VenueAdmin]
      security: [{ AdminToken: [] }]
      summary: 关闭无有效预约的具体场次
      parameters: [{ $ref: '#/components/parameters/SessionSlotId' }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /venue-admin/sessions/close-day:
    post:
      tags: [VenueAdmin]
      security: [{ AdminToken: [] }]
      summary: 关闭指定日期内无有效预约的具体场次
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /venue-admin/bookings/list:
    get:
      tags: [VenueAdmin]
      security: [{ AdminToken: [] }]
      parameters: [{ $ref: '#/components/parameters/OptionalDate' }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /venue-admin/reports/operations:
    get:
      tags: [VenueAdmin]
      security: [{ AdminToken: [] }]
      summary: 查询当前场馆经营报表
      parameters:
        - { $ref: '#/components/parameters/StartDate' }
        - { $ref: '#/components/parameters/EndDate' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /venue-admin/reports/service-fees:
    get:
      tags: [VenueAdmin]
      security: [{ AdminToken: [] }]
      summary: 查询当前场馆月度服务费
      parameters: [{ $ref: '#/components/parameters/BillingMonth' }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /venue-admin/bookings/create:
    post:
      tags: [VenueAdmin]
      security: [{ AdminToken: [] }]
      summary: 创建线下预约
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /venue-admin/bookings/{bookingId}/cancel:
    post:
      tags: [VenueAdmin]
      security: [{ AdminToken: [] }]
      parameters: [{ $ref: '#/components/parameters/BookingId' }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /venue-admin/employees/list:
    get:
      tags: [VenueAdmin]
      security: [{ AdminToken: [] }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /venue-admin/employees/create:
    post:
      tags: [VenueAdmin]
      security: [{ AdminToken: [] }]
      requestBody: { $ref: '#/components/requestBodies/Name' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /venue-admin/employees/{employeeId}/binding-code:
    post:
      tags: [VenueAdmin]
      security: [{ AdminToken: [] }]
      parameters: [{ $ref: '#/components/parameters/EmployeeId' }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /venue-admin/employees/{employeeId}/status:
    patch:
      tags: [VenueAdmin]
      security: [{ AdminToken: [] }]
      parameters: [{ $ref: '#/components/parameters/EmployeeId' }]
      requestBody: { $ref: '#/components/requestBodies/Status' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /mini/sports:
    get:
      tags: [Mini]
      security: [{ MiniToken: [] }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /mini/venues:
    get:
      tags: [Mini]
      security: [{ MiniToken: [] }]
      parameters:
        - { name: keyword, in: query, schema: { type: string } }
        - { name: sportTypeId, in: query, schema: { type: integer, format: int64 } }
        - { $ref: '#/components/parameters/OptionalDate' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /mini/venues/{venueId}:
    get:
      tags: [Mini]
      security: [{ MiniToken: [] }]
      parameters:
        - { $ref: '#/components/parameters/VenueId' }
        - { name: sportTypeId, in: query, schema: { type: integer, format: int64 } }
        - { $ref: '#/components/parameters/OptionalDate' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /mini/bookings/list:
    get:
      tags: [Mini]
      security: [{ MiniToken: [] }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /mini/bookings/create:
    post:
      tags: [Mini]
      security: [{ MiniToken: [] }]
      summary: 创建待支付预约并占位
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /mini/bookings/{bookingId}:
    get:
      tags: [Mini]
      security: [{ MiniToken: [] }]
      parameters: [{ $ref: '#/components/parameters/BookingId' }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /mini/bookings/{bookingId}/mock-pay:
    post:
      tags: [Mini]
      security: [{ MiniToken: [] }]
      parameters: [{ $ref: '#/components/parameters/BookingId' }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /mini/bookings/{bookingId}/cancel:
    post:
      tags: [Mini]
      security: [{ MiniToken: [] }]
      parameters: [{ $ref: '#/components/parameters/BookingId' }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /mini/staff/bind:
    post:
      tags: [Staff]
      security: [{ MiniToken: [] }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /staff/verifications/records:
    get:
      tags: [Staff]
      security: [{ MiniToken: [] }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /staff/verifications/verify:
    post:
      tags: [Staff]
      security: [{ MiniToken: [] }]
      summary: 二维码或短码核销
      responses:
        '200': { $ref: '#/components/responses/Success' }
components:
  securitySchemes:
    AdminToken:
      type: apiKey
      in: header
      name: X-Admin-Token
    MiniToken:
      type: apiKey
      in: header
      name: X-Mini-Token
  parameters:
    VenueId:
      name: venueId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    BookingId:
      name: bookingId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    WeeklySlotId:
      name: weeklySlotId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    SessionSlotId:
      name: sessionSlotId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    EmployeeId:
      name: employeeId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    Date:
      name: date
      in: query
      required: true
      schema: { type: string, format: date }
    OptionalDate:
      name: date
      in: query
      required: false
      schema: { type: string, format: date }
    BillingMonth:
      name: billingMonth
      in: query
      required: true
      schema:
        type: string
        pattern: '^\d{4}-(0[1-9]|1[0-2])$'
    StartDate:
      name: startDate
      in: query
      required: true
      schema: { type: string, format: date }
    EndDate:
      name: endDate
      in: query
      required: true
      schema: { type: string, format: date }
  schemas:
    VenueWrite:
      type: object
      required: [name, address, phone]
      properties:
        name: { type: string }
        city: { type: string, default: 郑州市 }
        address: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        phone: { type: string }
        facilities: { type: string }
        entryNotice: { type: string }
        bookingDaysAhead: { type: integer, default: 7 }
        minBookingMinutes: { type: integer, default: 30 }
        cancelCutoffMinutes: { type: integer, default: 120 }
  requestBodies:
    Name:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name]
            properties:
              name: { type: string }
    Status:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [status]
            properties:
              status: { type: string }
    Court:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name, sportIds]
            properties:
              name: { type: string }
              sportIds: { type: array, items: { type: integer, format: int64 } }
              status: { type: string }
    WeeklySlot:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [courtId, sportTypeId, dayOfWeek, startTime, endTime, priceFen]
            properties:
              courtId: { type: integer, format: int64 }
              sportTypeId: { type: integer, format: int64 }
              dayOfWeek: { type: integer, minimum: 1, maximum: 7 }
              startTime: { type: string, format: time }
              endTime: { type: string, format: time }
              priceFen: { type: integer, minimum: 0 }
  responses:
    Success:
      description: 成功
      content:
        application/json:
          schema:
            type: object
            required: [code, msg]
            properties:
              data: {}
              code: { type: integer, example: 0 }
              msg: { type: string, example: 成功 }
