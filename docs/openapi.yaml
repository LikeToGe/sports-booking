openapi: 3.0.3
info:
  title: Venue Booking MVP Admin API
  version: 0.1.0
  description: |
    T-01 至 T-12 Mock 功能闭环：平台与场馆管理员完成供给、订单、账单与审计管理；小程序用户完成查询、预约、Mock 支付、取消、退款和核销凭证；店员完成独立身份绑定与核销。真实支付、真实退款和生产环境仍不在本契约范围内。
    所有响应使用 data、code、serviceCode、msg 四个外层字段，serviceCode 固定为 "10000"。
servers:
  - url: /api
tags:
  - name: AdminAuth
  - name: Dashboards
  - name: Organizations
  - name: Catalog
  - name: VenueProfile
  - name: VenueResources
  - name: VenueSchedules
  - name: TransactionGates
  - name: MiniAuth
  - name: MiniVenues
  - name: MiniBookings
  - name: MiniPayments
  - name: MiniRefunds
  - name: Employees
  - name: StaffBinding
  - name: StaffVerifications
  - name: PlatformOrders
  - name: VenueOrders
  - name: Billing
  - name: AuditLogs
paths:
  /admin/dashboard/summary:
    get:
      tags: [Dashboards]
      summary: 查询平台运营汇总
      operationId: getPlatformDashboardSummary
      security: [{ adminSession: [] }]
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenericResponse' }
  /venue/dashboard/summary:
    get:
      tags: [Dashboards]
      summary: 查询当前场馆经营汇总与七日趋势
      operationId: getVenueDashboardSummary
      security: [{ adminSession: [] }]
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenericResponse' }
  /admin/auth/login:
    post:
      tags: [AdminAuth]
      summary: 管理端登录
      operationId: adminLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 已处理；成功时服务端写入安全会话 Cookie。
          headers:
            Set-Cookie:
              schema:
                type: string
              description: HttpOnly、Secure、SameSite 会话 Cookie。
            X-CSRF-Token:
              schema:
                type: string
              description: 与本次会话绑定的 CSRF 令牌；后续有副作用请求放入 X-CSRF-Token 请求头。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/BusinessError'
  /admin/auth/password/change:
    post:
      tags: [AdminAuth]
      summary: 首次登录修改初始密码
      operationId: changeInitialPassword
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      security:
        - adminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: 密码已修改，其他会话已撤销。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptySuccessResponse'
        '401':
          $ref: '#/components/responses/BusinessError'
        '409':
          $ref: '#/components/responses/BusinessError'
  /admin/auth/logout:
    post:
      tags: [AdminAuth]
      summary: 退出当前会话
      operationId: adminLogout
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      security:
        - adminSession: []
      responses:
        '200':
          description: 当前会话已撤销。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptySuccessResponse'
        '401':
          $ref: '#/components/responses/BusinessError'
  /admin/auth/session:
    get:
      tags: [AdminAuth]
      summary: 查询当前管理端会话
      operationId: getAdminSession
      security:
        - adminSession: []
      responses:
        '200':
          description: 当前认证主体及其数据范围。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          $ref: '#/components/responses/BusinessError'
  /admin/organizations:
    get:
      tags: [Organizations]
      summary: 分页查询经营主体及其唯一门店、场馆管理员
      operationId: listOrganizations
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [ACTIVE, PAUSED]
        - name: keyword
          in: query
          required: false
          description: 匹配经营主体、门店、管理员名称或账号。
          schema: { type: string }
      security:
        - adminSession: []
      responses:
        '200':
          description: 记录使用字符串 ID 与字符串分页计数；不包含密码哈希或会话令牌。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationPageResponse'
        '401':
          $ref: '#/components/responses/BusinessError'
        '403':
          $ref: '#/components/responses/BusinessError'
    post:
      tags: [Organizations]
      summary: 创建经营主体、唯一门店和首个场馆管理员
      operationId: createOrganization
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      security:
        - adminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizationRequest'
      responses:
        '200':
          description: 创建成功；平台管理员设置并线下交接的临时密码不出现在响应中。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateOrganizationResponse'
        '401':
          $ref: '#/components/responses/BusinessError'
        '403':
          $ref: '#/components/responses/BusinessError'
        '409':
          $ref: '#/components/responses/BusinessError'
  /admin/organizations/{organizationId}:
    get:
      tags: [Organizations]
      summary: 查询经营主体、门店、管理员与交易门禁详情
      operationId: getOrganization
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      security: [{ adminSession: [] }]
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenericResponse' }
  /admin/organizations/{organizationId}/status:
    patch:
      tags: [Organizations]
      summary: 平台启用或暂停经营主体
      operationId: updateOrganizationStatus
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      security:
        - adminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusUpdateRequest'
      responses:
        '200':
          description: 暂停时在经营主体门禁写入平台状态 blocker；恢复只解除该 blocker。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptySuccessResponse'
  /admin/organizations/{organizationId}/admin-password/reset:
    post:
      tags: [Organizations]
      summary: 重置当前经营主体场馆管理员密码
      operationId: resetVenueAdminPassword
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      security:
        - adminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetVenueAdminPasswordRequest'
      responses:
        '200':
          description: 写入临时密码哈希，撤销该场馆管理员全部旧会话并写入审计；密码不返回。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptySuccessResponse'
  /admin/stores/{storeId}/status:
    patch:
      tags: [Organizations]
      summary: 平台启用或暂停单门店场馆
      operationId: updateStoreStatus
      parameters:
        - $ref: '#/components/parameters/StoreId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      security:
        - adminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusUpdateRequest'
      responses:
        '200':
          description: 状态已更新；暂停时同步创建平台状态交易 blocker，恢复只解除该 blocker，不影响其他暂停原因或存量交易。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptySuccessResponse'
        '401':
          $ref: '#/components/responses/BusinessError'
        '403':
          $ref: '#/components/responses/BusinessError'
        '404':
          $ref: '#/components/responses/BusinessError'
  /admin/organizations/{organizationId}/transaction-gate:
    get:
      tags: [TransactionGates]
      summary: 查询经营主体及其唯一门店的交易门禁状态
      operationId: getOrganizationTransactionGate
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      security:
        - adminSession: []
      responses:
        '200':
          description: 返回主体、门店两级门禁及所有暂停原因。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionStatusResponse'
        '401':
          $ref: '#/components/responses/BusinessError'
        '403':
          $ref: '#/components/responses/BusinessError'
        '404':
          $ref: '#/components/responses/BusinessError'
  /admin/organizations/{organizationId}/transaction-blockers:
    post:
      tags: [TransactionGates]
      summary: 平台管理员暂停经营主体新增交易
      operationId: createOrganizationTransactionBlocker
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      security:
        - adminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManualTransactionBlockerRequest'
      responses:
        '200':
          description: 暂停原因已生效；不释放既有占用或订单。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionStatusResponse'
        '401':
          $ref: '#/components/responses/BusinessError'
        '403':
          $ref: '#/components/responses/BusinessError'
        '409':
          $ref: '#/components/responses/BusinessError'
  /admin/organizations/{organizationId}/transaction-blockers/{blockerId}/release:
    post:
      tags: [TransactionGates]
      summary: 解除经营主体的指定交易暂停原因
      operationId: releaseOrganizationTransactionBlocker
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/BlockerId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      security:
        - adminSession: []
      responses:
        '200':
          description: 仅解除指定 blocker；其他原因仍可保持门禁关闭。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionStatusResponse'
        '401':
          $ref: '#/components/responses/BusinessError'
        '403':
          $ref: '#/components/responses/BusinessError'
        '404':
          $ref: '#/components/responses/BusinessError'
        '409':
          $ref: '#/components/responses/BusinessError'
  /admin/stores/{storeId}/transaction-gate:
    get:
      tags: [TransactionGates]
      summary: 查询门店及经营主体交易门禁状态
      operationId: getStoreTransactionGate
      parameters:
        - $ref: '#/components/parameters/StoreId'
      security:
        - adminSession: []
      responses:
        '200':
          description: 返回主体、门店两级门禁及所有暂停原因。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionStatusResponse'
        '401':
          $ref: '#/components/responses/BusinessError'
        '403':
          $ref: '#/components/responses/BusinessError'
        '404':
          $ref: '#/components/responses/BusinessError'
  /admin/stores/{storeId}/transaction-blockers:
    post:
      tags: [TransactionGates]
      summary: 平台管理员暂停门店新增交易
      operationId: createStoreTransactionBlocker
      parameters:
        - $ref: '#/components/parameters/StoreId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      security:
        - adminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManualTransactionBlockerRequest'
      responses:
        '200':
          description: 暂停原因已生效；不释放既有占用或订单。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionStatusResponse'
        '401':
          $ref: '#/components/responses/BusinessError'
        '403':
          $ref: '#/components/responses/BusinessError'
        '409':
          $ref: '#/components/responses/BusinessError'
  /admin/stores/{storeId}/transaction-blockers/{blockerId}/release:
    post:
      tags: [TransactionGates]
      summary: 解除门店的指定交易暂停原因
      operationId: releaseStoreTransactionBlocker
      parameters:
        - $ref: '#/components/parameters/StoreId'
        - $ref: '#/components/parameters/BlockerId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      security:
        - adminSession: []
      responses:
        '200':
          description: 仅解除指定 blocker；其他原因仍可保持门禁关闭。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionStatusResponse'
        '401':
          $ref: '#/components/responses/BusinessError'
        '403':
          $ref: '#/components/responses/BusinessError'
        '404':
          $ref: '#/components/responses/BusinessError'
        '409':
          $ref: '#/components/responses/BusinessError'
  /venue/transaction-gate:
    get:
      tags: [TransactionGates]
      summary: 场馆管理员查询本人门店及经营主体交易门禁
      operationId: getCurrentVenueTransactionGate
      security:
        - adminSession: []
      responses:
        '200':
          description: 返回主体、门店两级门禁及所有暂停原因。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionStatusResponse'
        '401':
          $ref: '#/components/responses/BusinessError'
        '403':
          $ref: '#/components/responses/BusinessError'
  /venue/transaction-blockers:
    post:
      tags: [TransactionGates]
      summary: 场馆管理员暂停本人门店新增交易
      operationId: createCurrentVenueTransactionBlocker
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      security:
        - adminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManualTransactionBlockerRequest'
      responses:
        '200':
          description: 暂停原因已生效；不释放既有占用或订单。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionStatusResponse'
        '401':
          $ref: '#/components/responses/BusinessError'
        '403':
          $ref: '#/components/responses/BusinessError'
        '409':
          $ref: '#/components/responses/BusinessError'
  /venue/transaction-blockers/{blockerId}/release:
    post:
      tags: [TransactionGates]
      summary: 场馆管理员解除本人门店的指定暂停原因
      operationId: releaseCurrentVenueTransactionBlocker
      parameters:
        - $ref: '#/components/parameters/BlockerId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      security:
        - adminSession: []
      responses:
        '200':
          description: 仅解除指定 blocker；其他原因仍可保持门禁关闭。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionStatusResponse'
        '401':
          $ref: '#/components/responses/BusinessError'
        '403':
          $ref: '#/components/responses/BusinessError'
        '404':
          $ref: '#/components/responses/BusinessError'
        '409':
          $ref: '#/components/responses/BusinessError'
  /admin/catalog/sport-categories:
    get:
      tags: [Catalog]
      summary: 分页查询运动分类
      operationId: listSportCategories
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/StatusFilter'
      security:
        - adminSession: []
      responses:
        '200':
          description: 返回按层级和排序排列的扁平分类记录；客户端以 parentId 渲染两级树。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SportCategoryPageResponse'
        '401':
          $ref: '#/components/responses/BusinessError'
        '403':
          $ref: '#/components/responses/BusinessError'
    post:
      tags: [Catalog]
      summary: 创建运动分类
      operationId: createSportCategory
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      security:
        - adminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SportCategoryUpsertRequest'
      responses:
        '200':
          description: 分类已创建。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SportCategoryResponse'
        '400':
          $ref: '#/components/responses/BusinessError'
        '401':
          $ref: '#/components/responses/BusinessError'
        '403':
          $ref: '#/components/responses/BusinessError'
        '409':
          $ref: '#/components/responses/BusinessError'
  /admin/catalog/sport-categories/{categoryId}:
    put:
      tags: [Catalog]
      summary: 编辑运动分类
      operationId: updateSportCategory
      parameters:
        - $ref: '#/components/parameters/CategoryId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      security:
        - adminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SportCategoryUpsertRequest'
      responses:
        '200':
          description: 分类已更新。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SportCategoryResponse'
        '400':
          $ref: '#/components/responses/BusinessError'
        '401':
          $ref: '#/components/responses/BusinessError'
        '403':
          $ref: '#/components/responses/BusinessError'
        '404':
          $ref: '#/components/responses/BusinessError'
        '409':
          $ref: '#/components/responses/BusinessError'
  /admin/catalog/sport-categories/{categoryId}/status:
    patch:
      tags: [Catalog]
      summary: 启用或停用运动分类
      operationId: updateSportCategoryStatus
      parameters:
        - $ref: '#/components/parameters/CategoryId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      security:
        - adminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusUpdateRequest'
      responses:
        '200':
          description: 分类状态已更新，历史引用不受影响。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptySuccessResponse'
        '401':
          $ref: '#/components/responses/BusinessError'
        '403':
          $ref: '#/components/responses/BusinessError'
        '404':
          $ref: '#/components/responses/BusinessError'
  /admin/catalog/rental-types:
    get:
      tags: [Catalog]
      summary: 分页查询出租类型
      operationId: listRentalTypes
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/SportCategoryIdFilter'
        - $ref: '#/components/parameters/StatusFilter'
      security:
        - adminSession: []
      responses:
        '200':
          description: 返回出租类型及其所属具体运动项目。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RentalTypePageResponse'
        '401':
          $ref: '#/components/responses/BusinessError'
        '403':
          $ref: '#/components/responses/BusinessError'
    post:
      tags: [Catalog]
      summary: 创建出租类型
      operationId: createRentalType
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      security:
        - adminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RentalTypeUpsertRequest'
      responses:
        '200':
          description: 出租类型已创建。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RentalTypeResponse'
        '400':
          $ref: '#/components/responses/BusinessError'
        '401':
          $ref: '#/components/responses/BusinessError'
        '403':
          $ref: '#/components/responses/BusinessError'
        '409':
          $ref: '#/components/responses/BusinessError'
  /admin/catalog/rental-types/{rentalTypeId}:
    put:
      tags: [Catalog]
      summary: 编辑出租类型
      operationId: updateRentalType
      parameters:
        - $ref: '#/components/parameters/RentalTypeId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      security:
        - adminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RentalTypeUpsertRequest'
      responses:
        '200':
          description: 出租类型已更新。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RentalTypeResponse'
        '400':
          $ref: '#/components/responses/BusinessError'
        '401':
          $ref: '#/components/responses/BusinessError'
        '403':
          $ref: '#/components/responses/BusinessError'
        '404':
          $ref: '#/components/responses/BusinessError'
        '409':
          $ref: '#/components/responses/BusinessError'
  /admin/catalog/rental-types/{rentalTypeId}/status:
    patch:
      tags: [Catalog]
      summary: 启用或停用出租类型
      operationId: updateRentalTypeStatus
      parameters:
        - $ref: '#/components/parameters/RentalTypeId'
