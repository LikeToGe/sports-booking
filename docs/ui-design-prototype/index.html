function showDialog(key,source){const fallbackNames={notifications:'消息通知',governance:'内容治理',settings:'场地与排期',staff:'场馆员工身份',expiry:'赠送余额到期',export:'导出报表',fees:'月度服务费明细',navigation:'场馆导航',filters:'筛选预约',review:'场地评价',venues:'切换场馆',flows:'余额流水','my-posts':'我的发布',reports:'举报与申诉',verify:'扫码核销与会员识别','web-login':'Web 后台扫码登录',agreement:'社区协议与隐私说明','post-filters':'动态筛选',publish:'发布动态',recruitment:'找搭子',comments:'评论',share:'分享',sports:'运动类型'};const [title,body]=dialogContent[key]||[fallbackNames[key]||'界面预览','<p>此入口沿用当前方案的颜色、字号、列表与表单样式。完整操作页在选定风格后展开。</p>'];document.querySelector('#dialog-title').textContent=key==='slot'&&source?.dataset.slotInfo?source.dataset.slotInfo:title;document.querySelector('#dialog-content').innerHTML=body;document.querySelector('#review-dialog').showModal();}
function updateURL(){const url=new URL(location.href);url.searchParams.set('variant',state.variant);url.searchParams.set('view',state.mode);url.searchParams.set('admin',state.admin);url.searchParams.set('mini',state.mini);history.replaceState(null,'',url);}

function render(){document.body.className=`view-${state.mode}${params.has('capture')?' capture-mode':''}`;document.querySelectorAll('[data-variant]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.variant===state.variant));document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===state.mode));document.querySelector('#variant-name').textContent=`${state.variant} · ${variants[state.variant].name}`;document.querySelector('#direction-description').innerHTML=variants[state.variant].description;document.querySelector('#admin-canvas').innerHTML=renderAdmin();document.querySelector('#mini-canvas').innerHTML=renderMini();document.querySelector('#admin-caption').textContent=adminPages[state.admin];document.querySelector('#mini-caption').textContent=miniPages[state.mini];document.querySelector('#admin-note').textContent=variants[state.variant].admin;document.querySelector('#mini-note').textContent=variants[state.variant].mini;document.querySelector('#admin-select').value=state.admin;document.querySelector('#mini-select').value=state.mini;document.querySelector('#inventory').innerHTML=renderInventory();if(params.has('capture'))document.querySelector('#review-title').textContent=`${state.variant} · ${variants[state.variant].name} / 双端 UI 设计方向`;updateURL();resizeBoards();}
function cycle(direction){const keys=Object.keys(variants);state.variant=keys[(keys.indexOf(state.variant)+direction+keys.length)%keys.length];render();}
document.querySelector('#admin-select').innerHTML=Object.entries(adminPages).map(([id,label])=>`<option value="${id}">${label}</option>`).join('');document.querySelector('#mini-select').innerHTML=Object.entries(miniPages).map(([id,label])=>`<option value="${id}">${label}</option>`).join('');document.querySelector('#previous-variant').innerHTML=icon('ChevronLeft');document.querySelector('#next-variant').innerHTML=icon('ChevronRight');document.querySelector('#dialog-x').innerHTML=icon('X');document.querySelector('#previous-variant').onclick=()=>cycle(-1);document.querySelector('#next-variant').onclick=()=>cycle(1);document.querySelector('#dialog-x').onclick=document.querySelector('#dialog-close').onclick=()=>document.querySelector('#review-dialog').close();document.querySelector('#admin-select').onchange=e=>{state.admin=e.target.value;render();};document.querySelector('#mini-select').onchange=e=>{state.mini=e.target.value;render();};document.addEventListener('click',e=>{const target=e.target.closest('button');if(!target)return;const d=target.dataset;if(d.variant){state.variant=d.variant;render();}else if(d.mode){state.mode=d.mode;render();}else if(d.admin){state.admin=d.admin;render();}else if(d.mini){state.mini=d.mini;render();}else if(d.openAdmin){state.admin=d.openAdmin;state.mode='admin';render();}else if(d.openMini){state.mini=d.openMini;state.mode='mini';render();}else if(d.sport){state.sport=d.sport;render();}else if(d.day){state.day=Number(d.day);render();}else if(d.court){state.court=Number(d.court);render();}else if(d.slot){state.slot=d.slot;render();}else if(d.plan){state.plan=Number(d.plan);render();}else if('like'in d){state.liked=!state.liked;render();}else if(d.dialog){showDialog(d.dialog,target);}});document.addEventListener('input',e=>{if(e.target.matches('[data-table-search]')){const q=e.target.value.trim();document.querySelectorAll('.data-table tbody tr').forEach(row=>row.hidden=!row.textContent.includes(q));}if(e.target.matches('[data-venue-search]')){const q=e.target.value.trim();document.querySelectorAll('[data-venue-list]>button').forEach(row=>row.hidden=!row.textContent.includes(q));}});document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select,[contenteditable=true]')||document.querySelector('dialog[open]'))return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();cycle(e.key==='ArrowLeft'?-1:1);}});new ResizeObserver(resizeBoards).observe(document.querySelector('.comparison'));window.addEventListener('resize',resizeBoards);render();
</script>
